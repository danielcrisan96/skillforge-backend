name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - run: chmod +x gradlew
      # Compilează și rulează toate testele. Cele de persistență pornesc un MongoDB real, cu Testcontainers.
      - run: ./gradlew build

  image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Dovada că Dockerfile-ul încă funcționează, înainte de orice deploy.
      - run: docker compose build

  deploy:
    needs: image
    # Doar de pe main și doar dacă variabilele există: un fork, sau repo-ul înainte de set-up, sare peste job și
    # rularea rămâne verde.
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      # Doar acest job poate cere tokenul semnat de GitHub, pe care Google îl schimbă pe o oră de drepturi.
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/skillforge/skillforge-api
      TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push the image, tagged with the commit SHA
        run: |
          docker build --build-arg SERVICE=skillforge-api --build-arg PORT=8090 -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      # Se schimbă doar imaginea: contul, portul, profilul și secretele rămân cele de la primul deploy, făcut de mână.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy skillforge-api --image "$IMAGE:$TAG" --update-labels "commit=$TAG" --quiet
          gcloud run services update-traffic skillforge-api --to-latest --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe skillforge-api --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/actuator/health"
          echo "Deployed $TAG, serving at $url"
